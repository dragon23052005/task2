<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Management System | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">
    <main class="login-wrap">
        <div class="text-center mb-4"><a href="index.html" class="logo-box">M</a>
            <h1 class="login-title">Welcome Back!</h1>
            <p class="login-subtitle">Sign in to continue to your account</p>
        </div>
        <div class="login-card">
            <h2>Login to your account</h2>
            <p>Enter your email and password to get started.</p>
            <form id="loginForm"><label for="email" class="form-label">Email Address</label><input type="email"
                    id="email" class="form-control" placeholder="name@example.com" required><label for="password"
                    class="form-label mt-3">Password</label>
                <div class="password-field"><input type="password" id="password" class="form-control"
                        placeholder="Enter your password" required minlength="6"><button type="button"
                        id="togglePassword">Show</button></div>
                <div class="d-flex justify-content-between align-items-center my-3"><label class="remember"><input
                            type="checkbox"> Remember me</label><a href="#" id="forgotLink">Forgot password?</a></div>
                <button type="submit" class="btn login-btn w-100">Sign In</button>
                <div id="loginMessage" class="small mt-3" role="status"></div>
            </form>
            <p class="signup-text">Don't have an account? <a href="#" id="signupLink">Create an account</a></p>
        </div>
        <div class="text-center mt-4"><a href="index.html" class="back-link">← Back to Home</a></div>
    </main>
    <script src="script.js"></script>
</body>

</html>
